<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StadiumSquare Venue Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Welcome to StadiumSquare</h1>
        <p>Select a restaurant to view its menu</p>
    </header>
    <main>
        <div class="menu-grid">
            <a href="https://orderaway.com.au/austfootbleamarstadearl" class="menu-link">
                <img src="Banner%20Images/Earl.png" alt="Earl Cafe" class="menu-link__image">
                <div class="menu-link__title">Earl Cafe</div>
            </a>
            <a href="https://orderaway.com.au/austfootbleamarstad8bitst" class="menu-link">
                <img src="Banner%20Images/8BIT.png" alt="8BIT" class="menu-link__image">
                <div class="menu-link__title">8BIT</div>
            </a>
            <a href="https://orderaway.com.au/austfootbleamarstadjohwal" class="menu-link">
                <img src="Banner%20Images/Johnnie%20Walker.png" alt="Johnny Walker" class="menu-link__image">
                <div class="menu-link__title">Johnny Walker</div>
            </a>
            <a href="https://orderaway.com.au/austfootbleamarstadstadsq" class="menu-link">
                <img src="Banner%20Images/Popcorn%20Cart.png" alt="Popcorn Cart" class="menu-link__image">
                <div class="menu-link__title">Popcorn Cart</div>
            </a>
            <a href="https://orderaway.com.au/ejabrhqiogsjchjhyojp" class="menu-link">
                <img src="Banner%20Images/Drinks%20Station.png" alt="Drinks Station" class="menu-link__image">
                <div class="menu-link__title">Drinks Station</div>
            </a>
            <a href="https://orderaway.com.au/ktlnajtohbqavpdprbnf" class="menu-link">
                <img src="Banner%20Images/Marathon%20Dim%20Sims.png" alt="Marathon Dim Sims" class="menu-link__image">
                <div class="menu-link__title">Marathon Dim Sims</div>
            </a>
            <a href="https://orderaway.com.au/yzmzhrrxvgcxszexodri" class="menu-link">
                <img src="Banner%20Images/Butchers%20Block.png" alt="Butchers Block" class="menu-link__image">
                <div class="menu-link__title">Butchers Block</div>
            </a>
        </div>
    </main>
</body>
</html>
